task: detect
mode: train

model: yolov8n.pt
dataset: UAVs
classes:
  - drone

epochs: 30
imgsz: 640
batch: 16
device: 0

optimizer: auto
pretrained: true
seed: 0
deterministic: true
amp: true

# Learning rate
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# Warmup
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0